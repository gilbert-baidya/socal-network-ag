name: Deploy frontend to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare public frontend artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -- \
            index.html \
            styles.css \
            script.js \
            socal-network-logo.png \
            "Annual Intercultural Pastors Appriciation Dinne card.png" \
            _site/

          test -f _site/index.html
          test -f _site/styles.css
          test -f _site/script.js
          test -f _site/socal-network-logo.png
          test -f "_site/Annual Intercultural Pastors Appriciation Dinne card.png"
          test ! -e _site/google-apps-script
          test ! -e _site/.clasp.json
          test ! -e _site/.clasprc.json
          test ! -e _site/.git
          test ! -e _site/.github
          test ! -e _site/README.md
          test ! -e _site/.gitignore
          test "$(find _site -type f | wc -l | tr -d ' ')" -eq 5

      - name: Set up GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
